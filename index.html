<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekfold</title>
<meta name="description" content="A quiet weekly reflection app for the Mac. Gather your week, look at it, and fold it. Everything stays on your Mac.">
<meta name="theme-color" content="#ded6c2">
<meta property="og:title" content="Weekfold">
<meta property="og:description" content="A quiet weekly reflection app for the Mac. Everything stays on your Mac.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hudsonrivercrossing.github.io/weekfold/">
<meta property="og:image" content="https://hudsonrivercrossing.github.io/weekfold/media/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<link rel="preload" href="fonts/wenkai-medium-subset.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Decided before first paint: play the film, or rest on its last frame (seen this session, or Reduce Motion).
  (() => {
    let seen = false;
    try { seen = sessionStorage.getItem("wf.seen") === "1"; sessionStorage.setItem("wf.seen", "1"); } catch {}
    const rest = seen || matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.documentElement.dataset.film = rest ? "rest" : "play";
  })();
  // The film ends on the logo and "Weekfold"; the plain card (an SVG in the film's 1280×720 coordinates) dissolves in on top,
  // matched to the frame on wide screens, a readable size on tall ones. Download sits just under the word.
  window.placeCTA = () => {
    const w = innerWidth, h = innerHeight, tall = w / h <= 1;
    // Wide: the film's own frame, cover. Tall: centred on the logo, sized to fit 400×330 film px, never above 1.2×.
    const s = tall ? Math.min(w / 400, h / 330, 1.2) : Math.max(w / 1280, h / 720);
    const vb = tall ? [640 - w / s / 2, 365 - h / s / 2, w / s, h / s] : [0, 0, 1280, 720];
    const y = h / 2 + (470 - (vb[1] + vb[3] / 2)) * s + Math.max(20, 28 * s);   // 470 = the word's baseline in the film
    document.documentElement.style.setProperty("--cta-y", Math.round(y) + "px");
    const card = document.querySelector(".card");
    if (card) { card.setAttribute("viewBox", vb.map(n => n.toFixed(1)).join(" ")); card.setAttribute("preserveAspectRatio", tall ? "xMidYMid meet" : "xMidYMid slice"); }
  };
  placeCTA();
</script>
<style>
  @font-face {
    font-family: "Weekfold WenKai";
    src: url("fonts/wenkai-medium-subset.woff2") format("woff2");
    font-weight: 500; font-display: swap;
  }
  :root {
    --ink: #2b2620;
    --ink-2: #5d554b;
    --plain: #f1e9dc;                               /* the card the film settles into */
    --paper: rgb(247 242 232 / 0.84);
    --paper-solid: #f7f2e8;
    --line: rgb(43 38 32 / 0.12);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    --brand: "Weekfold WenKai", "Kaiti SC", "STKaiti", var(--font);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--plain);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .film {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: var(--plain) center / cover no-repeat;
    pointer-events: none;
    user-select: none;
  }
  [data-film="play"] .film { background-image: url("media/start.jpg"); }
  [data-film="rest"] .film { background-image: url("media/end.jpg"); }
  /* Tall screens: show the whole film rather than crop the figure away. */
  @media (max-aspect-ratio: 1/1) {
    .film { object-fit: contain; background-image: none !important; }
  }

  /* The film ends on felt; after a beat the same logo and word dissolve onto plain paper. */
  .card {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; user-select: none;
    opacity: 0; visibility: hidden;
    transition: opacity 300ms ease, visibility 0s linear 300ms;
  }
  [data-film="rest"] .card { opacity: 1; visibility: visible; transition: opacity 900ms ease 500ms; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    appearance: none; border: 0; cursor: pointer;
    font: 500 15px/1 var(--brand);
    color: var(--ink); text-decoration: none;
    background: var(--paper);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 0 0 0.5px var(--line), 0 1px 2px rgb(43 38 32 / 0.08);
    border-radius: 999px;
    min-height: 40px;
  }
  @media (pointer: coarse) { .pill { min-height: 44px; } }
  @media (hover: hover) and (pointer: fine) { .pill:hover { background: var(--paper-solid); } }
  .pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  header {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
    right: max(20px, env(safe-area-inset-right));
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .mark { gap: 10px; font-size: 17px; padding: 6px 16px 6px 6px; }
  .mark img { width: 28px; height: 28px; border-radius: 999px; display: block; }
  .button { padding: 0 18px; }

  /* Header while the film plays; once it rests on its own logo and word, the header steps back
     and Download moves under the word, so the page ends on one logo and one action. */
  header > *, .cta {
    transition: opacity 300ms var(--ease-out), translate 300ms var(--ease-out), visibility 0s linear 300ms,
                background-color 150ms ease, scale 150ms ease-out;
  }
  [data-film="rest"] header > * { opacity: 0; visibility: hidden; translate: 0 -4px; }
  .cta {
    position: fixed; left: 50%; top: var(--cta-y, 70%);
    transform: translateX(-50%);
    padding: 0 22px;
    opacity: 0; visibility: hidden; translate: 0 6px;
  }
  [data-film="rest"] .cta {
    opacity: 1; visibility: visible; translate: 0 0;
    transition: opacity 400ms var(--ease-out) 1100ms, translate 400ms var(--ease-out) 1100ms, background-color 150ms ease, scale 150ms ease-out;
  }
  [data-film="play"] header > * {
    transition: opacity 300ms var(--ease-out), translate 300ms var(--ease-out), background-color 150ms ease, scale 150ms ease-out;
  }
  .button:active, .cta:active, .replay:active { scale: 0.96; }

  .replay, .sound {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 44px; height: 44px;
    display: grid; place-items: center;
    appearance: none; border: 0; cursor: pointer;
    color: var(--ink-2);
    background: var(--paper);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 0 0 0.5px var(--line);
    border-radius: 999px;
    opacity: 0; visibility: hidden;
    transition: opacity 200ms ease, scale 150ms ease-out, visibility 0s linear 200ms;
  }
  .sound { opacity: 1; visibility: visible; transition: translate 200ms var(--ease-out), scale 150ms ease-out; }
  body:has(.replay.shown) .sound { translate: -56px 0; }         /* makes room for replay once the film rests */
  .sound .on, .sound[aria-pressed="true"] .off { display: none; }
  .sound[aria-pressed="true"] .on { display: block; }
  .sound:active { scale: 0.96; }
  .sound:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sound svg { width: 18px; height: 18px; }
  .replay.shown { opacity: 1; visibility: visible; transition: opacity 200ms ease, scale 150ms ease-out; }
  .replay:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .replay svg { width: 18px; height: 18px; translate: 0.5px 0; }

  dialog {
    border: 0; padding: 24px 24px 20px;
    width: min(340px, calc(100vw - 32px));
    border-radius: 16px;
    color: var(--ink);
    background: var(--paper-solid);
    box-shadow: 0 0 0 0.5px var(--line), 0 8px 24px rgb(43 38 32 / 0.14), 0 2px 6px rgb(43 38 32 / 0.08);
    font-family: var(--font);
  }
  dialog::backdrop { background: rgb(43 38 32 / 0.18); }
  dialog[open] { animation: open 200ms var(--ease-out); }
  dialog[open]::backdrop { animation: fade 200ms var(--ease-out); }
  @keyframes open { from { opacity: 0; transform: scale(0.96); } }
  @keyframes fade { from { opacity: 0; } }
  dialog h2 { margin: 0 0 8px; font: 500 20px/1.3 var(--brand); text-wrap: balance; }
  dialog p { margin: 0 0 20px; font-size: 14px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
  dialog form { display: flex; justify-content: flex-end; margin: 0; }
  dialog .pill { background: var(--ink); color: var(--paper-solid); box-shadow: none; min-width: 72px; padding: 0 18px; transition: background-color 150ms ease, scale 150ms ease-out; }
  dialog .pill:active { scale: 0.96; }
  @media (hover: hover) and (pointer: fine) { dialog .pill:hover { background: #3d362e; } }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    header > *, .cta, [data-film] header > *, [data-film="rest"] .cta, .replay, .replay.shown, .sound, dialog .pill, .card, [data-film="rest"] .card { transition: none; }
    [data-film="rest"] header > *, .cta { translate: none; }
    .button:active, .cta:active, .replay:active, .sound:active, dialog .pill:active { scale: 1; }
    dialog[open], dialog[open]::backdrop { animation: none; }
  }
</style>
</head>
<body>
  <video class="film" id="film" muted playsinline preload="auto" aria-hidden="true" disablepictureinpicture>
    <source src="media/week.webm" type='video/webm; codecs="av01.0.05M.10"'>
    <source src="media/week.mp4" type="video/mp4">
  </video>

  <svg class="card" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect x="-10000" y="-10000" width="21280" height="20720" fill="#f1e9dc"/>
    <image href="media/icon-512.png" x="553.85" y="224.2" width="172.3" height="172.3"/>
    <text x="640" y="470" text-anchor="middle" font-family="'Weekfold WenKai', 'Kaiti SC', serif" font-weight="500" font-size="61.3" fill="#2b2620">Weekfold</text>
  </svg>

  <header>
    <a class="pill mark" href="./"><img src="media/icon.png" alt="" width="28" height="28">Weekfold</a>
    <button class="pill button download" type="button" data-i18n="download">Download</button>
  </header>

  <h1 class="sr" data-i18n="tagline">Weekfold: a quiet weekly reflection app for the Mac.</h1>

  <button class="pill cta download" type="button" data-i18n="download">Download</button>

  <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Sound" data-i18n-label="sound">
    <svg class="off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8v4h3l4 3.5v-11l-4 3.5z"/><path d="M14 8l4 4M18 8l-4 4"/></svg>
    <svg class="on" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8v4h3l4 3.5v-11l-4 3.5z"/><path d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.8 5.5a6.5 6.5 0 0 1 0 9"/></svg>
  </button>
  <button class="replay" id="replay" type="button" aria-label="Play again" data-i18n-label="replay">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7"/><path d="M3.5 3.5v3.2h3.2"/></svg>
  </button>

  <dialog id="soon" aria-labelledby="soon-title">
    <h2 id="soon-title" data-i18n="soonTitle">Coming in December</h2>
    <p data-i18n="soonBody">Weekfold for Mac is in a small private beta. The public release is planned for December.</p>
    <form method="dialog"><button class="pill" data-i18n="ok" autofocus>OK</button></form>
  </dialog>

<script>
  const zh = /^zh/i.test(navigator.language || "");
  if (zh) {
    const t = {
      download: "下载",
      tagline: "Weekfold：Mac 上一个安静的每周回顾 app。",
      replay: "再看一遍",
      sound: "声音",
      soonTitle: "12 月见",
      soonBody: "Weekfold for Mac 正在小范围内测，公开版本计划在 12 月发布。",
      ok: "好",
    };
    document.documentElement.lang = "zh-Hans";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-label]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.i18nLabel]); });
  }

  const root = document.documentElement;
  const film = document.getElementById("film");
  const replay = document.getElementById("replay");
  placeCTA();
  addEventListener("resize", placeCTA);

  // The film plays once and rests on its last frame; a loop would unfold the week again.
  function rest() {
    root.dataset.film = "rest";
    film.poster = "media/end.jpg";
    replay.classList.add("shown");
  }
  film.addEventListener("ended", rest);
  function playFromStart() {
    replay.classList.remove("shown");
    root.dataset.film = "play";
    film.currentTime = 0;
    film.play().catch(rest);
  }
  replay.addEventListener("click", playFromStart);

  // The film starts muted (browsers only autoplay silent video). Turning sound on while it rests plays it again from the start.
  const sound = document.getElementById("sound");
  sound.addEventListener("click", () => {
    const on = sound.getAttribute("aria-pressed") !== "true";
    sound.setAttribute("aria-pressed", String(on));
    film.muted = !on;
    if (on && root.dataset.film === "rest") playFromStart();
  });

  if (root.dataset.film === "rest") {
    film.preload = "metadata";
    rest();
  } else {
    film.poster = "media/start.jpg";
    film.play().catch(rest);
  }

  const soon = document.getElementById("soon");
  document.querySelectorAll(".download").forEach(b => b.addEventListener("click", () => soon.showModal()));
  soon.addEventListener("click", e => { if (e.target === soon) soon.close(); });
</script>
</body>
</html>
